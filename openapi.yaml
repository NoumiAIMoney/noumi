openapi: 3.0.3
info:
  title: Noumi API
  version: 1.0.0
  description: List of all endpoints for Noumi

paths:
  /quiz:
    post:
      summary: Submit quiz data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goal_name, goal_description, goal_amount, target_date, net_monthly_income]
              properties:
                goal_name:
                  type: string
                goal_description:
                  type: string
                goal_amount:
                  type: number
                target_date:
                  type: string
                  format: date
                net_monthly_income:
                  type: number
      responses:
        '200':
          description: Quiz data accepted

  /plaid/connect:
    post:
      summary: Initiate Plaid connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                public_token:
                  type: string
      responses:
        '200':
          description: Plaid connection established and data fetched

  /anomalies/yearly:
    get:
      summary: Get yearly anomaly counts
      responses:
        '200':
          description: Anomalies per month for the current year
          content:
            application/json:
              schema:
                type: object
                properties:
                  anomalies:
                    type: array
                    items:
                      type: integer
                    example: [2, 0, 1, 3, 2, 0, 0, 1, 0, 2, 1, 0]

  /trends:
    get:
      summary: Get spending trends
      responses:
        '200':
          description: List of spending trends from prompt engineering
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    icon:
                      type: string
                    trend:
                      type: string

  /spending/categories:
    get:
      summary: Get spending categories
      responses:
        '200':
          description: Category breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    category_name:
                      type: string
                    amount:
                      type: number

  /goal/computed:
    get:
      summary: Get computed goal data
      responses:
        '200':
          description: Computed goal values, which come from the quiz, saved in the database (assuming saved so far)
          content:
            application/json:
              schema:
                type: object
                properties:
                  goal_name:
                    type: string
                  target_date:
                    type: string
                    format: date
                  goal_amount:
                    type: number
                  amount_saved:
                    type: number

  /habits:
    get:
      summary: Get user habits
      responses:
        '200':
          description: List of suggested habits by prompt engineering and the number of occurrences that are suggested
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    habit_description:
                      type: string
                    occurrences:
                      type: integer

  /streak/weekly:
    get:
      summary: Get streak per week
      responses:
        '200':
          description: Weekly streak of no anomalies
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                example: [1, 1, 0, 1, 1, 1, 0]

  /spending/status:
    get:
      summary: Get spending status
      responses:
        '200':
          description: Current financial status for the home screen
          content:
            application/json:
              schema:
                type: object
                properties:
                  income:
                    type: number
                  expenses:
                    type: number
                  amount_safe_to_spend:
                    type: number

  /savings/weekly:
    get:
      summary: Get weekly savings data
      responses:
        '200':
          description: Weekly savings summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  actual_savings:
                    type: number
                  suggested_savings_amount_weekly:
                    type: number

  /streak/longest:
    get:
      summary: Get longest no-anomaly streak
      responses:
        '200':
          description: Longest streak of days with no anomalies for the current year
          content:
            application/json:
              schema:
                type: object
                properties:
                  longest_streak:
                    type: integer

  /spending/total:
    get:
      summary: Get total amount spent
      responses:
        '200':
          description: Total spent so far this year
          content:
            application/json:
              schema:
                type: object
                properties:
                  spent_so_far:
                    type: number
