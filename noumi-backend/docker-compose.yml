version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: noumi-postgres
    environment:
      POSTGRES_DB: noumidb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d noumidb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - noumi-network

  # Test database for running tests
  postgres-test:
    image: postgres:15-alpine
    container_name: noumi-postgres-test
    environment:
      POSTGRES_DB: noumidb_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d noumidb_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - noumi-network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: noumi-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@noumi.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8081:80"
    depends_on:
      - postgres
    networks:
      - noumi-network
    profiles:
      - admin

volumes:
  postgres_data:
    driver: local
  postgres_test_data:
    driver: local

networks:
  noumi-network:
    driver: bridge